
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Next Gen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-blue-700 text-white p-6">
        <div class="max-w-5xl mx-auto">
            <h1 class="text-3xl font-bold">JavaScript Next Gen</h1>
            <p class="mt-2">Praktikum Pemrograman Web</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-6">
        <section class="bg-white rounded-xl shadow p-6">
            <h2 class="text-xl font-bold mb-2">Demo JavaScript Modern</h2>
            <p class="text-gray-600 mb-4">
                Pelajari fitur JavaScript modern melalui contoh interaktif.
            </p>

            <div class="flex gap-3 mb-6">
                <button id="runBtn" class="btn-primary">
                    Run Demo
                </button>
                <button id="clearBtn" class="btn-secondary">
                    Clear Output
                </button>
            </div>

            <div id="output" class="space-y-4">
                <p class="text-gray-500">
                    Klik Run Demo untuk menampilkan hasil praktikum.
                </p>
            </div>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
