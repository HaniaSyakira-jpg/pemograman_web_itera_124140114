
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript - Loop & Fungsi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }

    section {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px;
      margin: 20px 0;
    }

    input, button {
      padding: 9px;
      margin: 4px 2px;
      box-sizing: border-box;
    }

    input {
      max-width: 100%;
    }

    button {
      cursor: pointer;
    }

    .hasil {
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .error {
      color: #c62828;
    }

    .sukses {
      color: #16803c;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>Praktikum JavaScript Dasar</h1>
  <p>Bab 2: Loop & Fungsi</p>

  <section>
    <h2>1. Daftar Nilai Siswa</h2>
    <div id="result"></div>
  </section>

  <section>
    <h2>2. Demo Event Handler</h2>
    <input type="text" id="nama-input" placeholder="Masukkan nama">
    <button id="sapa-button">Sapa Saya</button>
    <div id="sapa-output" class="hasil"></div>

    <h3>Kalkulator Sederhana</h3>
    <input type="number" id="angka1" placeholder="Angka 1">
    <input type="number" id="angka2" placeholder="Angka 2">
    <div>
      <button data-operasi="tambah">+</button>
      <button data-operasi="kurang">−</button>
      <button data-operasi="kali">×</button>
      <button data-operasi="bagi">÷</button>
    </div>
    <div id="hasil-kalkulator" class="hasil"></div>
  </section>

  <section>
    <h2>3. Tabel Perkalian</h2>
    <input type="number" id="angka-perkalian" value="5" min="1">
    <button id="btn-perkalian">Buat Tabel</button>
    <div id="hasil-perkalian" class="hasil"></div>
  </section>

  <section>
    <h2>4. Faktorial</h2>
    <input type="number" id="angka-faktorial" value="5" min="0" max="170">
    <button id="btn-faktorial">Hitung Faktorial</button>
    <div id="hasil-faktorial" class="hasil"></div>
  </section>

  <section>
    <h2>5. Pemeriksa Bilangan Prima</h2>
    <input type="number" id="angka-prima" value="7" min="0">
    <button id="btn-prima">Periksa</button>
    <div id="hasil-prima" class="hasil"></div>
  </section>

  <section>
    <h2>6. Kalkulator BMI</h2>
    <label for="berat">Berat badan (kg):</label>
    <input type="number" id="berat" min="1" step="any" placeholder="Contoh: 60">
    <br>
    <label for="tinggi">Tinggi badan (cm):</label>
    <input type="number" id="tinggi" min="1" step="any" placeholder="Contoh: 170">
    <br>
    <button id="btn-bmi">Hitung BMI</button>
    <div id="hasil-bmi" class="hasil"></div>
  </section>

  <section>
    <h2>7. FizzBuzz (1–100)</h2>
    <button id="btn-fizzbuzz">Jalankan FizzBuzz</button>
    <pre id="hasil-fizzbuzz" class="hasil"></pre>
  </section>

  <script src="script.js"></script>
</body>
</html>
